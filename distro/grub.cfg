# PadSampler OS: isti fajl za BIOS (/boot/grub/grub.cfg) i UEFI (/EFI/debian/grub.cfg, potpisani GRUB)
insmod part_gpt
insmod fat
insmod all_video
search --no-floppy --label PADSAMPLER --set=root

set default=0
set timeout_style=hidden
set timeout=1

set cmdline="boot=live components persistence persistence-label=persistence quiet loglevel=3 threadirqs preempt=full console=ttyS0,115200 console=tty0"

menuentry "PadSampler" {
    linux /live/vmlinuz $cmdline
    initrd /live/initrd.img
}
menuentry "PadSampler (safe graphics)" {
    linux /live/vmlinuz $cmdline nomodeset
    initrd /live/initrd.img
}
menuentry "PadSampler (bez sacuvanih podesavanja)" {
    linux /live/vmlinuz boot=live components quiet loglevel=3 threadirqs preempt=full
    initrd /live/initrd.img
}
