# PadSampler za Linux: motor (libpadsampler.so), C++ testovi i aplikacija (folder sa bin/PadSampler),
# za x86_64 (PC, laptop, mini PC) i arm64 (Raspberry Pi 4/5). Ubuntu 22.04 (glibc 2.35) -> radi i na Debianu 12+.
name: Linux build

on:
  push:
    branches: [linux]
    paths-ignore: ['website/**', 'docs/**', '**.md']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Paketi
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev libpulse-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Motor (libpadsampler.so)
        run: |
          cmake -S desktop -B desktop/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/build

      - name: C++ testovi
        run: ctest --test-dir desktop/build --output-on-failure

      - name: Provjera RtAudio API-ja u motoru
        run: nm -D --defined-only desktop/build/libpadsampler.so | grep -c Java_ && ldd desktop/build/libpadsampler.so

      - name: Aplikacija (createDistributable)
        working-directory: desktop-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon createDistributable

      - name: Pakovanje
        run: |
          cd desktop-app/build/installer/main/app
          tar -czf "$GITHUB_WORKSPACE/PadSampler-linux-${{ matrix.arch }}.tar.gz" PadSampler
          ls -la PadSampler/bin PadSampler/lib/app | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: PadSampler-linux-${{ matrix.arch }}
          path: PadSampler-linux-${{ matrix.arch }}.tar.gz
          retention-days: 30

  # USB image za PC (x86_64): Debian 13 + PadSampler, BIOS i UEFI. Vidi distro/README.md.
  image-x86_64:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PadSampler-linux-x86_64

      - name: Sistem (Debian 13, u kontejneru)
        run: |
          docker run --rm --privileged -v "$PWD:/w" -w /w debian:trixie \
            bash distro/build-rootfs.sh PadSampler-linux-x86_64.tar.gz out
          sudo chown -R "$USER" out

      - name: Image
        run: |
          sudo apt-get update
          sudo apt-get install -y gdisk dosfstools mtools e2fsprogs grub-pc-bin
          sudo bash distro/make-image.sh out padsampler-os-x86_64.img
          sudo chown "$USER" padsampler-os-x86_64.img

      - name: Test u QEMU (UEFI i BIOS)
        run: |
          sudo apt-get install -y qemu-system-x86 ovmf socat
          sudo chmod 666 /dev/kvm || true
          bash distro/test-qemu.sh padsampler-os-x86_64.img qemu-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-test
          path: qemu-test/
          retention-days: 30

      - name: Kompresija
        run: xz -T0 -6 -v padsampler-os-x86_64.img

      - uses: actions/upload-artifact@v4
        with:
          name: padsampler-os-x86_64
          path: padsampler-os-x86_64.img.xz
          compression-level: 0
          retention-days: 30
